aid: octobat
name: Octobat
review:
  question: Does Octobat expose a documented public WebSocket API?
  answer: false
  date: '2026-07-03'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. Octobat's public surface is a
    Stripe-style request/response REST API at https://apiv2.octobat.com. There
    is no server-push transport (WebSocket or SSE) on Octobat's own API to
    model. Octobat can send outbound webhook (HTTP callback) notifications for
    events, but those are server-to-endpoint HTTP POSTs, not a bidirectional or
    streaming WebSocket, and there is no documented event-stream channel.
findings:
  summary: |
    Octobat does not publish a documented public WebSocket API. Octobat is a
    billing, invoicing, and tax-compliance platform for online businesses. Its
    public API is a Stripe-style REST API with base URL https://apiv2.octobat.com,
    authenticated via HTTP Basic using a secret key as the username with an
    empty password (test keys sk_test_, live keys sk_live_). All documented
    interaction is request/response REST over HTTPS - creating customers,
    invoices, invoice items, transactions, and running real-time tax
    determination via tax_evidences / tax_evidence_requests. No realtime,
    bidirectional, or streaming WebSocket (ws:// or wss://) endpoint is
    documented anywhere in Octobat's developer documentation or SDKs.
  operatingStatus: |
    Octobat is in a post-acquisition, maintenance / integrated state rather than
    an actively marketed standalone product. Mirakl acquired Octobat in
    November 2021 (its first-ever acquisition) to add invoice-compliance to the
    Mirakl marketplace platform. As of this review, the bare domain octobat.com
    does not resolve, and www.octobat.com/apidoc and www.octobat.com/pricing
    now 302-redirect to mirakl.com. However, the developer documentation at
    docs.octobat.com and the API at apiv2.octobat.com remain reachable, and the
    official SDKs (e.g. the Ruby gem github.com/0ctobat/octobat-ruby) are still
    published. The product's invoice-compliance capability is now largely
    delivered as part of Mirakl. Existing integrators still have API access;
    new prospective users are effectively routed to Mirakl. Public, reconciled
    pricing is no longer available.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://apiv2.octobat.com
      documented: true
      note: Stripe-style resource-oriented REST. HTTP Basic auth (secret key as username, empty password).
    - protocol: Webhook
      scheme: https
      documented: true
      note: Octobat can POST event notifications to a configured HTTP endpoint. Server-to-endpoint HTTP callback, not WebSocket.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented in Octobat's docs, API reference, or SDKs as of the review date.
