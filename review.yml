  modelingNote: |
    endpointsConfirmedRest paths are demonstrated directly in Octobat's own
    documentation (the generic-integration "register transactions" and
    "tax calculation for a cart or an order" guides). endpointsModeledRest
    paths are derived from Octobat's official Ruby SDK
    (github.com/0ctobat/octobat-ruby), whose APIResource base class builds each
    resource URL as the snake_cased, pluralized class name and uses POST to
    create, PATCH to update, GET to retrieve/list, and DELETE to remove; the
    special action routes (confirm, cancel, activate, csv_export, for_supplier,
    etc.) are taken verbatim from the SDK resource classes. Field-level request
    and response schemas are representative and should be verified against the
    live reference at https://v2apidoc.octobat.com.
sources:
  - url: https://docs.octobat.com/octobat/development/api
    type: Documentation
    note: Octobat API overview; publishable vs secret keys, testmode vs livemode, RESTful API.
  - url: https://docs.octobat.com/octobat/integrations-docs/generic-integration/register-transactions-in-octobat
    type: Documentation
    note: Confirms base URL https://apiv2.octobat.com, HTTP Basic auth, and POST /customers, POST /invoices, POST /invoices/{id}/items, PATCH /invoices/{id}/confirm, POST /transactions.
  - url: https://docs.octobat.com/octobat/integrations-docs/generic-integration/tax-calculation-for-a-cart-or-an-order
    type: Documentation
    note: Confirms POST /tax_evidences and POST /tax_evidence_requests for tax determination.
  - url: https://v2apidoc.octobat.com
    type: APIReference
    note: Octobat v2 API reference (live). No WebSocket surface listed.
  - url: https://github.com/0ctobat/octobat-ruby
    type: SourceCode
    note: Official Ruby SDK; source of the resource list and action routes (invoices, credit_notes, transactions, customers, products, tax_evidences, tax_evidence_requests, coupons, subscriptions, usage_items, payouts, payment_sources, payouts, plaza, reporting).
  - url: https://www.mirakl.com/news/mirakl-acquires-invoice-compliance-startup-octobat
    type: Reference
    note: Mirakl acquired Octobat, announced 2021-11-09 - basis for the operating-status note.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. Octobat's own public API is
    request/response REST (apiv2.octobat.com) with optional outbound webhook
    (HTTP callback) notifications. No AsyncAPI document was created because
    there is no documented server-push / streaming transport on Octobat's own
    API to model.
