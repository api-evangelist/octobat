aid: octobat
url: https://raw.githubusercontent.com/api-evangelist/octobat/refs/heads/main/apis.yml
name: Octobat
kind: company
description: Octobat is a billing, invoicing, and tax-compliance platform for online
  businesses. It automates the creation, delivery, and storage of legally compliant
  invoices, credit notes, self-billing invoices, and tax receipts for every online
  transaction, and provides a real-time tax (VAT / GST / sales tax) determination
  engine for tax-exclusive and tax-inclusive billing models. Octobat integrates with
  Stripe, GoCardless, and other payment providers, and exposes a Stripe-style REST
  API at base URL https://apiv2.octobat.com authenticated with HTTP Basic (secret
  key). Octobat also ships Beanie (a hosted checkout) and Plaza (marketplace / platform
  tax and invoicing for connected accounts). Operating status - Octobat was acquired
  by Mirakl in November 2021; the standalone marketing site (octobat.com) now redirects
  to mirakl.com, while the developer documentation at docs.octobat.com and the
  apiv2.octobat.com API remain available to existing integrators.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Billing
- Invoicing
- Tax Compliance
- VAT
- E-Commerce
- Payments
- Fintech
