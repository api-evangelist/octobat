    type: Documentation
  - url: https://v2apidoc.octobat.com
    type: APIReference
  - url: openapi/octobat-openapi.yml
    type: OpenAPI
  - url: collections/octobat.postman_collection.json
    type: PostmanCollection
  - url: collections/octobat.opencollection.json
    type: OpenCollection
  description: Create, list, retrieve, update, and delete compliant invoices, then add
    invoice items, confirm (finalize) them, set payment terms, send them by email,
    mark them uncollectible, cancel, cancel-and-replace, and export to PDF or CSV.
    Confirming an invoice assigns it a sequential legal number; listing supports
    filtering by customer and status (including due / unpaid invoices).
